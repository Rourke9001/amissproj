# AmissProj database configuration.
#
# These are the local-development defaults. Override any value WITHOUT
# rebuilding by setting an environment variable (these win over the file):
#   AMISS_DB_URL, AMISS_DB_USER, AMISS_DB_PASSWORD
#
# This file is bundled onto the classpath by scripts\build.ps1. It holds only
# a local dev password; never put a real secret here - use the env vars.

db.url=jdbc:mysql://localhost:3306/amissdb?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
db.user=amiss
db.password=amisspw
