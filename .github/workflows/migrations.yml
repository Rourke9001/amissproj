# Migrations — proves a clean database is built purely from the versioned
# Flyway migrations (ROADMAP Phase 2 / KAN-15): boots a throwaway MySQL 9,
# provisions the database + accounts with db/bootstrap.sql, migrates as the
# amiss_migrator account and then verifies the seed data as the
# least-privilege runtime user.
name: Migrations

on:
  push:
    branches: [main, develop]
  pull_request:

concurrency:
  group: migrations-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  migrate:
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:9
        env:
          MYSQL_ROOT_PASSWORD: ci-root
        ports:
          - 3306:3306
        options: >-
          --health-cmd "mysqladmin ping -h localhost -pci-root"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      # bootstrap.sql creates the accounts as 'localhost' only. Connections
      # to a service container arrive from the Docker bridge, not localhost,
      # so mirror the two accounts for any host — same passwords, same grants.
      - name: Provision database and accounts (db/bootstrap.sql)
        run: |
          mysql -h 127.0.0.1 -uroot -pci-root < db/bootstrap.sql
          mysql -h 127.0.0.1 -uroot -pci-root <<'SQL'
          CREATE USER 'amiss'@'%' IDENTIFIED BY 'amisspw';
          GRANT SELECT, INSERT, UPDATE ON amissdb.* TO 'amiss'@'%';
          GRANT DELETE ON amissdb.tblsave TO 'amiss'@'%';
          CREATE USER 'amiss_migrator'@'%' IDENTIFIED BY 'amissmigratorpw';
          GRANT CREATE, ALTER, DROP, INDEX, REFERENCES,
                SELECT, INSERT, UPDATE, DELETE
              ON amissdb.* TO 'amiss_migrator'@'%';
          SQL

      # -pl amiss-core: the flyway plugin + migration sources live in that
      # module now; running the goal reactor-wide would re-invoke it per module.
      - name: Migrate as amiss_migrator
        run: >-
          ./mvnw -B -pl amiss-core flyway:migrate flyway:info
          "-Dflyway.url=jdbc:mysql://127.0.0.1:3306/amissdb?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC"
          -Dflyway.user=amiss_migrator
          -Dflyway.password=amissmigratorpw

      - name: Verify seed data as the least-privilege runtime user
        run: |
          jobs=$(mysql -h 127.0.0.1 -uamiss -pamisspw amissdb -N -e 'SELECT COUNT(*) FROM tbljob')
          degrees=$(mysql -h 127.0.0.1 -uamiss -pamisspw amissdb -N -e 'SELECT COUNT(*) FROM tbldegrees')
          topics=$(mysql -h 127.0.0.1 -uamiss -pamisspw amissdb -N -e 'SELECT COUNT(*) FROM tblhelp')
          echo "tbljob rows: $jobs (want 39); tbldegrees rows: $degrees (want 11); tblhelp rows: $topics (want 4)"
          test "$jobs" -eq 39
          test "$degrees" -eq 11
          test "$topics" -eq 4

      # The app's only DELETE is removing a save slot (KAN-45); the amiss
      # account holds DELETE on tblsave alone (KAN-57). Prove it end-to-end:
      # create a save as amiss, delete it as amiss, and confirm the
      # ON DELETE CASCADE cleaned the child row without child-table grants.
      - name: Verify save deletion as the least-privilege runtime user
        run: |
          mysql -h 127.0.0.1 -uamiss -pamisspw amissdb <<'SQL'
          INSERT INTO tbluser (name, password) VALUES ('ci_delete_check', 'x');
          INSERT INTO tblsave (owner, label, goal_wealth, goal_happiness, goal_education, goal_career)
              VALUES ('ci_delete_check', 'ci', 10, 10, 10, 10);
          INSERT INTO tblsave_degrees (save_id, degree_id)
              SELECT id, 1 FROM tblsave WHERE owner = 'ci_delete_check';
          SQL
          save_id=$(mysql -h 127.0.0.1 -uamiss -pamisspw amissdb -N -e "SELECT id FROM tblsave WHERE owner = 'ci_delete_check'")
          mysql -h 127.0.0.1 -uamiss -pamisspw amissdb -e "DELETE FROM tblsave WHERE id = $save_id"
          saves=$(mysql -h 127.0.0.1 -uamiss -pamisspw amissdb -N -e "SELECT COUNT(*) FROM tblsave WHERE id = $save_id")
          leftovers=$(mysql -h 127.0.0.1 -uamiss -pamisspw amissdb -N -e "SELECT COUNT(*) FROM tblsave_degrees WHERE save_id = $save_id")
          echo "saves left: $saves (want 0); cascaded child rows left: $leftovers (want 0)"
          test "$saves" -eq 0
          test "$leftovers" -eq 0
          mysql -h 127.0.0.1 -uroot -pci-root amissdb -e "DELETE FROM tbluser WHERE name = 'ci_delete_check'"
