# CI — compile + run the JUnit suite on every push to the long-lived branches
# and on every pull request (ROADMAP Phase 2 / KAN-14).
#
# The `build` job is the required status check enforced by the branch
# protection ruleset on `main`: a red build blocks the PR.
#
# The `coverage-badge` job publishes the JaCoCo badges to the orphan `badges`
# branch on pushes to `main` only. The badges live on their own branch because
# `main` is protected (CI cannot commit to it) and build artifacts don't
# belong in the source history.
name: CI

on:
  push:
    branches: [main, develop]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      # verify (not package) so the amiss-coverage module aggregates the
      # per-module JaCoCo results into one report.
      - name: Build and test
        run: ./mvnw -B clean verify

      # jacoco.csv columns: 4/5 = instructions missed/covered, 6/7 = branches,
      # 8/9 = lines. Sum across classes for the totals shown in the run summary.
      - name: Coverage summary
        run: |
          {
            echo '### JaCoCo coverage'
            awk -F, 'NR > 1 { im+=$4; ic+=$5; bm+=$6; bc+=$7; lm+=$8; lc+=$9 }
              END {
                printf "| Metric | Coverage |\n|---|---|\n"
                printf "| Instructions | %.1f%% |\n", 100*ic/(ic+im)
                printf "| Branches | %.1f%% |\n", 100*bc/(bc+bm)
                printf "| Lines | %.1f%% |\n", 100*lc/(lc+lm)
              }' amiss-coverage/target/site/jacoco-aggregate/jacoco.csv
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: surefire-reports
          path: '**/target/surefire-reports'
          if-no-files-found: ignore

      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        with:
          name: jacoco-report
          path: amiss-coverage/target/site/jacoco-aggregate

  coverage-badge:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: jacoco-report
          path: jacoco-report

      - name: Generate badges
        uses: cicirello/jacoco-badge-generator@v2
        with:
          jacoco-csv-file: jacoco-report/jacoco.csv
          badges-directory: badge-out
          generate-branches-badge: true

      # `git switch --orphan` clears tracked files but keeps the untracked
      # badge-out/ directory, so the new branch tip holds only the badges.
      - name: Publish badges to the badges branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git switch --orphan badges
          mv badge-out/*.svg .
          git add ./*.svg
          git commit -m "chore: update coverage badges"
          git push --force origin badges
