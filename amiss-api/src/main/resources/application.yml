# AmissProj REST API configuration.
#
# The same AMISS_DB_* environment variables the Swing client honours override
# everything here, so both apps are configured the same way. Two credential
# sets on purpose (mirrors the desktop app / KAN-15):
#   - spring.datasource  -> the least-privilege runtime user (SELECT/INSERT/UPDATE)
#   - spring.flyway      -> the DDL-capable migrator, used only at startup
spring:
  application:
    name: amiss-api
  datasource:
    url: ${AMISS_DB_URL:jdbc:mysql://localhost:3306/amissdb?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
    username: ${AMISS_DB_USER:amiss}
    password: ${AMISS_DB_PASSWORD:amisspw}
  flyway:
    url: ${AMISS_DB_URL:jdbc:mysql://localhost:3306/amissdb?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
    user: ${AMISS_DB_MIGRATOR_USER:amiss_migrator}
    password: ${AMISS_DB_MIGRATOR_PASSWORD:amissmigratorpw}
    # Pre-Flyway installs get baselined instead of failing (saves preserved) —
    # same behaviour as the Swing client's FlywayMigrator.
    baseline-on-migrate: true
    baseline-version: "1"
  mvc:
    problemdetails:
      enabled: true
  jpa:
    # Flyway owns the schema; Hibernate only validates its entity mappings
    # against it at startup — never generates or alters DDL (KAN-33).
    hibernate:
      ddl-auto: validate
    open-in-view: false

# Game balance (KAN-29): any amiss.costs.* key overrides the built-in ActionCosts
# default (all values are integer minutes). Same table the Swing client reads via
# AMISS_COSTS_* env vars / costs.*-minutes properties. Example:
#   amiss:
#     costs:
#       work-minutes: 300
#       travel-per-step-minutes: 40
#       base-week-minutes: 3600
#       fed-week-minutes: 4320
amiss:
  security:
    jwt:
      # HS256 signing secret for the register/login access tokens (KAN-36). This default
      # is DEV-ONLY (>= 32 ASCII chars so SecurityConfig's startup length check passes) —
      # every real deployment MUST override it via AMISS_JWT_SECRET, or anyone who reads
      # this file could forge tokens.
      secret: ${AMISS_JWT_SECRET:AmissProj-DEV-ONLY-JWT-secret-CHANGE-ME-1234567890}
      # Access-token lifetime (ISO-8601 duration); override via AMISS_JWT_TTL.
      ttl: ${AMISS_JWT_TTL:PT60M}
  cors:
    # Comma-separated origins allowed to call the API cross-origin (KAN-37), for the future
    # web frontend. Defaults to the Vite dev server; add the production origin here (or via
    # AMISS_CORS_ALLOWED_ORIGINS) at deploy time.
    allowed-origins: ${AMISS_CORS_ALLOWED_ORIGINS:http://localhost:5173}

management:
  endpoints:
    web:
      exposure:
        # Only health is public (KAN-37) — info/flyway leaked build/migration detail to any
        # anonymous caller and are no longer exposed over HTTP.
        include: health
  endpoint:
    health:
      # Status-only for anonymous callers (KAN-37): no component breakdown (DB, disk, etc.)
      # leaks over the public, unauthenticated health probe.
      show-details: never
